services:
  redis:
    # Redis 8.4 ships the Query Engine (RediSearch) built in.
    image: redis:8.4
    container_name: redis-adbc-test
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
