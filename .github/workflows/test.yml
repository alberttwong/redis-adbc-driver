# Runs the Go tests on Linux amd64 and arm64 against a standalone Redis.
# Float results can differ in the last bit between the two (Go fuses
# multiply-adds on arm64 but not amd64), so both are tested before merge
# rather than first in the release run. The 3-shard cluster, the validation
# suite and the other Linux distributions are left to release.yml.
#
# Runs on pull requests that change the driver or this file. A newer push to
# the same pull request cancels the run in progress.
name: Test

on:
  pull_request:
    paths:
      - .github/workflows/test.yml
      - go/**

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Start Redis
        working-directory: go
        run: docker compose up --detach --wait redis

      - name: Test
        working-directory: go
        env:
          REDIS_URI: redis://localhost:6379/0
        run: go test -count=1 ./...
